name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Замените на @v4, если доступно, или оставьте
    - name: Set up Python
      uses: actions/setup-python@v5 # Замените на @v5, если доступно, или оставьте
    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    - name: Build APK
      run: buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calcify-APK
        path: bin/*.apk
