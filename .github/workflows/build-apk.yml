name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Accept Android SDK licenses
      run: |
        # Создаем директорию для лицензий
        mkdir -p ~/.android
        # Принимаем лицензии автоматически
        yes | sdkmanager --licenses || true
      continue-on-error: true
    
    - name: Build APK
      run: |
        # Создаем buildozer.spec если его нет
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Запускаем сборку
        buildozer android debug
      env:
        # Автоматически принимаем лицензии
        ANDROID_SDK_LICENSE: true
        # Отключаем интерактивные запросы
        BUILD_GUARD: 0
        # Явно указываем пути
        ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        PATH: ${{ env.ANDROID_HOME }}/tools/bin:${{ env.ANDROID_HOME }}/platform-tools:${{ env.PATH }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calcify-APK
        path: bin/*.apk
